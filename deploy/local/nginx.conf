# nginx for `make preview`: serves dist/storybook like Cloudflare does in production.
# Keep the clean-URL rule in sync with deploy/cloudflare/_redirects. One deliberate difference: the
# captures here only accept the characters of sanitized ids, because nginx decodes the URI before
# matching and an unrestricted capture could put encoded control characters into the Location header.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Relative Location headers, so redirects such as /sample -> /sample/ keep the host port
    # published by compose instead of nginx's own port 8080.
    absolute_redirect off;

    # /{productId}/c/{category}/{component} -> the component's Default story.
    location ~ ^/([a-z0-9-]+)/c/([a-z0-9-]+)/([a-z0-9-]+)/?$ {
        return 302 /$1/?path=/story/$2-$3--default;
    }

    # Cloudflare reads _redirects as configuration and never serves it; do the same.
    location = /_redirects {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
