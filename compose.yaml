services:
  # Storybook dev server (docs/project_plan.md section 5). Tool commands such as lint and test run
  # in one-off containers of this service through the Makefile.
  storybook:
    build:
      context: .
      target: dev
    init: true
    ports:
      # The container port is fixed; only the host side is configurable.
      - '${DEV_PORT:-5070}:5070'
    environment:
      PRODUCT_ID: ${PRODUCT_ID:-sample}
    volumes:
      - .:/app
      # Keeps Linux dependencies separate from any node_modules on the host.
      - node_modules:/app/node_modules

  # Production build served by nginx (`make preview`). Behind a profile so that `make dev` and
  # the tool targets do not build it.
  preview:
    build:
      context: .
      target: preview
    profiles: [preview]
    ports:
      - '${PREVIEW_PORT:-5071}:8080'

volumes:
  node_modules:
