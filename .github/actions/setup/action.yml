name: Setup
description: Install pnpm (the packageManager version), Node.js (.nvmrc) and the locked dependencies.

inputs:
  cache:
    description: Cache the pnpm store. The release job passes 'false', so a cache cannot alter what is published.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install pnpm
      # The version comes from the packageManager field in package.json.
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        # Caching is controlled only by the cache input above.
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
