# The checks of `make ci` (docs/project_plan.md section 8): format check, lint, typecheck, unit
# tests with coverage, the package build and checks, and every product's Storybook build.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # The same script as `make ci`, run on the runner instead of in the dev image.
      - name: Run the CI checks
        run: pnpm run ci
