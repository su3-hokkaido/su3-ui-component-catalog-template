# Playwright visual regression test (docs/project_plan.md section 11). Storybook is built on the
# runner, then the suite runs in the same compose service and image as `make vrt`, so CI and local
# runs render identically.
name: VRT

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vrt:
    name: Visual regression test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build every Storybook
        run: pnpm run build-storybook:all

      # The runner user is uid 1001, the image's pwuser, so the bind mounts stay writable.
      - name: Run the visual regression test
        env:
          CI: 'true'
        run: |
          mkdir -p test-results playwright-report
          docker compose --profile vrt run --rm --build vrt

      - name: Upload the diff report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
