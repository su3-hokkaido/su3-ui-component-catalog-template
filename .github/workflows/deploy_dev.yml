# develop -> the Cloudflare Pages preview at the develop branch alias (docs/project_plan.md
# section 8).
name: Deploy (development)

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: development
      branch: develop
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
